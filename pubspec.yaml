name: zara_app

description: "A new Flutter project."

publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  flutter_svg: ^2.3.0
  gap: ^3.0.1
  iconsax_flutter: ^1.0.1
  iconsax_plus: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - Assets/icons/
    - Assets/images/

  fonts:
    - family: Gabarito
      fonts:
        - asset: Assets/fonts/Gabarito-Regular.ttf
          weight: 400
    - family: Circularstd
      fonts:
        - asset: Assets/fonts/circular-std-medium-500.ttf




  


